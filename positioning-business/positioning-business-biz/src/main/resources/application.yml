server:
  port: 8102

spring:
  application:
    name: positioning-business
  cloud:
    # Nacos 注册中心
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  # PostgreSQL: postgis_36_sample 库的 business 架构
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:postgis_36_sample}?options=-csearch_path%3Dbusiness%2Cpublic
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# Sa-Token 配置: 与认证服务共享 jwt-secret-key, 校验同一套 JWT
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: jwt
  jwt-secret-key: ${SA_TOKEN_SECRET:positioning-backend-sa-token-jwt-secret-2026}

# MyBatis-Plus
mybatis-plus:
  # 自定义类型处理器: PostgreSQL TIMESTAMPTZ -> LocalDateTime 转换
  type-handlers-package: com.positioning.common.mybatis
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.positioning.business: info

server:
  port: 8081

spring:
  application:
    name: positioning-gateway
  cloud:
    # Nacos 注册中心
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      routes:
        # 认证服务: 登录、注册、内部用户查询
        - id: positioning-auth
          uri: lb://positioning-auth
          predicates:
            - Path=/auth/**,/internal/**
          filters:
            - name: CircuitBreaker
              args:
                name: authBreaker
                fallbackUri: forward:/fallback/auth
        # 业务服务: 商场/车位/商铺/导航等
        - id: positioning-business
          uri: lb://positioning-business
          predicates:
            - Path=/business/**
          filters:
            - name: CircuitBreaker
              args:
                name: businessBreaker
                fallbackUri: forward:/fallback/business
      # 跨域配置（开发环境放开, 生产按需收紧）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

# 网关自定义限流参数
positioning:
  gateway:
    rate-limit:
      capacity: 100
      refill-per-minute: 100

# Resilience4j 熔断配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
    instances:
      authBreaker: {}
      businessBreaker: {}

logging:
  level:
    com.positioning.gateway: info
